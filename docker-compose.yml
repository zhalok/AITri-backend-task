services:
  db:
    image: postgres:16-alpine
    container_name: l10-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: l10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d l10"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
